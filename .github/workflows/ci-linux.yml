name: CI (Linux — cross-platform guard for packages/)
on:
  pull_request:
  push:
    branches: [main]

# Cancel a superseded run when a newer commit lands on the same ref
# (a PR push or a main push). Keyed on workflow + ref, so the three
# OS jobs (Linux/macOS/Windows) never cancel each other — only a
# prior run of THIS workflow on THIS branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-portable:
    runs-on: ubuntu-24.04
    # Failsafe against the main-snapshot toolchain's post-completion
    # runner hang (quirk F3: all tests finish, the test-runner process
    # parks in dispatchMain and never exits — would otherwise eat the
    # 6 h Actions default). Healthy runs are well under 15 min.
    timeout-minutes: 30
    container:
      # PINNED TO A MAIN-SNAPSHOT DIGEST, not a stable release (UP-5472):
      # the fix for the F1 Process.run() SIGSEGV (cross-platform-quirks.md)
      # merged to swift-corelibs-foundation main on 2026-05-19 (81eb85a)
      # but is in NO stable toolchain — 6.3.2 predates it and
      # release/6.4.x branched just before it. This digest is
      # swiftlang/swift:nightly-main-noble resolved on 2026-06-09;
      # .swift-version pins local swiftly dev to main-snapshot-2026-05-27
      # (both post-fix). Re-pin to the next stable release containing
      # 81eb85a — tracked in docs/planning/audit-followups.md (UP-5472).
      image: swiftlang/swift@sha256:f94c1fb1c41bef0d0bf3f0987f69c9432aba3148d73099d5594ae0b56225bb49
    steps:
      - uses: actions/checkout@v6
      - name: Install git + libjemalloc-dev
        # `git` — GitCore tests shell out to the system git for version
        #   probes, init/status round-trips, and merge-conflict fixtures.
        #   The Swift Linux images don't ship git.
        # `libjemalloc-dev` — package-benchmark links jemalloc on Linux
        #   for accurate malloc-tracking metrics. Bundled on macOS, missing
        #   on Linux without this. See docs/architecture/performance.md.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git libjemalloc-dev
          git --version
      - name: Build packages (portable subset)
        # Tier 1 + protocol shells of Tier 2 must compile on Linux.
        # Mac-only adapter sources are excluded by #if os(macOS).
        run: swift build
      - name: Run tests (portable subset)
        # Up to TWO automatic retries on the test step because of the
        # upstream SIGSEGV in `Foundation.findMaximumOpenFromProcSelfFD()`
        # on Linux (over-reads dirent.d_name; tracked at
        # swiftlang/swift-corelibs-foundation#5472, fix on a fork at
        # billdenney/swift-corelibs-foundation:fix/process-d_name-buffer-overrun).
        # The bug manifests as a process-wide crash during test
        # execution any time `Foundation.Process.run()` happens to hit
        # a near-page-boundary dirent. Per the cross-platform-quirks
        # catalog (`docs/architecture/cross-platform-quirks.md` F1) the
        # baseline hit rate is ~5 % per CI run, rising with concurrent
        # Process.run() activity — i.e. with how much of the test suite
        # spawns child processes. As that suite grew (sprigctl, the
        # M1→M2 integration tests, the AgentKit IPC end-to-end tests),
        # we observed back-to-back failures often enough that a single
        # retry was no longer sufficient; bumping `max=3` keeps the
        # false-fail rate well below 1 % without masking real
        # regressions (a deterministic test bug fails all three
        # attempts back-to-back).
        #
        # UPDATE 2026-06-09: the container image above is pinned to a
        # main-snapshot digest that CONTAINS the #5472 fix, so this
        # retry should no longer fire for F1. It stays as
        # belt-and-suspenders until the pin moves back to a stable
        # release (UP-5472 in docs/planning/audit-followups.md); the
        # follow-up that re-pins also evaluates dropping the retry.
        # The other CI legs (`ci-macos`, `ci-windows`) don't carry a
        # retry — they never hit this bug because
        # `findMaximumOpenFromProcSelfFD()` is gated by
        # `#if !canImport(Darwin) && !os(Windows)`.
        run: |
          set -e
          attempt=1
          max=3
          while true; do
            if swift test; then
              exit 0
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::Linux test suite failed $max times — not the upstream Foundation flake."
              exit 1
            fi
            echo "::warning::Linux test attempt $attempt failed; retrying (max $max attempts). Likely the upstream Foundation findMaximumOpenFromProcSelfFD() flake (swiftlang/swift-corelibs-foundation#5472)."
            attempt=$((attempt + 1))
          done

      - name: Smoke-build benchmarks
        # Just verify the benchmark target compiles. Full benchmark runs
        # happen nightly on the self-hosted runner (.github/workflows/
        # benchmarks.yml); hosted runners are too noisy for perf gates.
        run: swift build --target SprigCoreBenchmarks
