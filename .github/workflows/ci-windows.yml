name: CI (Windows)
on:
  pull_request:
  push:
    branches: [main]

# Windows is a **first-class supported platform** for development and testing.
# At MVP the macOS app is the user-facing product, but `sprigctl` and the
# entire `packages/` graph (GitCore, RepoState, ConflictKit, AIKit, LFSKit,
# SubmoduleKit, SubtreeKit, SafetyKit, IPCSchema, PlatformKit, DiagKit,
# StatusKit, TaskWindowKit, UIKitShared, plus the WatcherKit polling watcher)
# are expected to build, test, and behave identically on Windows.
#
# What's still macOS-only: FSEventsWatcher (the macOS kernel-level watcher;
# Windows uses the portable PollingFileWatcher). A native
# ReadDirectoryChangesW-based watcher is a future improvement (ADR 0048).
# The macOS shell (FinderSync, LaunchAgent, Sparkle) is not in scope here —
# Windows will eventually get its own apps/windows/ shell post-1.0.

jobs:
  build-test:
    runs-on: windows-2022
    # Failsafe: the underlying GitHub Actions default is 6 hours, which
    # is what bit PR #111's first Windows run (a hung test step kept
    # the job alive for an hour-plus before we noticed). 30 minutes is
    # generous for a healthy run (typical: ~10 min build + ~50 s test)
    # while still failing-fast on a true hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Action pinned to a SHA (was @main — three weeks of unreviewed
      # action drift between runs); toolchain bumped 6.3 → 6.3.1 to
      # match the local Server 2022 validation VM, so "passes on the
      # VM" keeps meaning "passes on CI".
      - uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5
        with:
          branch: swift-6.3.1-release
          tag: 6.3.1-RELEASE

      - name: Verify git is on PATH
        # The windows-2022 image ships Git for Windows pre-installed at
        # C:\Program Files\Git\bin\git.exe, which actions/runner-images puts
        # on PATH. We just sanity-check it here to fail fast with a clear
        # message if the image ever changes.
        shell: bash
        run: |
          git --version
          echo "git resolved to: $(which git)"

      - name: Scope Defender off the work + temp dirs (+ diagnose scanner state)
        # PreferencesViewModelTests' atomic rename intermittently hits
        # ERROR_SHARING_VIOLATION under ~1000-test parallel churn, expiring
        # its waitForFile budget (the hosted-Windows flake). A Foundation
        # Process child does NOT inherit the file handle — refuted by a
        # Windows-VM probe (2026-06-16, see audit-followups VM-ENV-1) — so
        # the holder is an external scanner/FS, with the real-time scanner
        # the leading candidate. Adding work/temp exclusions is low-risk on
        # an ephemeral CI runner; whether it HELPS depends on the holder.
        # The diagnostic block below resolves that empirically: it prints
        # the scanner's pre-existing state + exclusions BEFORE we touch
        # anything, so the next red/green tells us if the scanner was even
        # active (a prior note claimed hosted runners already ship
        # exclusions — this confirms or refutes it). Best-effort; never
        # fails the job.
        shell: pwsh
        run: |
          Write-Host "== Defender state BEFORE our changes =="
          try { Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled, AMRunningMode | Format-List } catch { Write-Host "Get-MpComputerStatus unavailable: $_" }
          try { (Get-MpPreference).ExclusionPath | ForEach-Object { Write-Host "pre-existing ExclusionPath: $_" } } catch {}
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, $env:TMP -ErrorAction SilentlyContinue
            Add-MpPreference -ExclusionProcess 'swift.exe','swiftc.exe','git.exe' -ErrorAction SilentlyContinue
            Write-Host "applied work/temp/process exclusions"
          } catch { Write-Host "Defender exclusion not applied: $_" }

      - name: Build packages
        run: swift build

      - name: Run tests
        run: swift test
