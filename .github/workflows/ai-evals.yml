name: AI evals
on:
  pull_request:
    paths:
      - 'packages/AIKit/**'
      - 'tests/ai-evals/**'

# Cancel a superseded run when a newer commit lands on the same PR ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-24.04
    container:
      image: swift:6.3-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install libjemalloc-dev
        # `swift test --filter AIEvals` still builds every target in
        # the package — including `SprigCoreBenchmarks`, which depends
        # on package-benchmark, which links jemalloc. Bundled on macOS,
        # missing on Linux without this. Mirrors the same step in
        # ci-linux.yml.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libjemalloc-dev
      - run: swift test --filter AIEvals
        env:
          SPRIG_AI_EVAL_FIXTURES: tests/ai-evals/fixtures
          # Provider keys set via GitHub secrets; Ollama runs in a sidecar.
